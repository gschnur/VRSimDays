[server]
host = "127.0.0.1"
port = 8765
allowed_origins = []          # added to the localhost default; add "null" to allow file:// pages

[scraper]
poll_hz = 60
count_outlap = false

[pit_actions]
enabled = true
window_title = "iRacing.com Simulator"
# VERIFY against your iRacing controls before relying on this.
key_sequence = [["alt", "r"]]   # list of steps; each step is a list of keys held together
fallback_key_sequence = []
pre_delay_ms = 150
failsafe = true

[logging]
level = "INFO"
file = "irlds.log"
